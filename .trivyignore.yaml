misconfigurations:
  # The ConfigMap carries the fleet config, whose `password:` key holds the
  # reference ${OCP_PASSWORD}; the value itself is in the Secret next to it.
  # The check matches on the key name and cannot see that.
  - id: AVD-KSV-0109
    paths:
      - deploy/pod/odl-pod.yaml
      - deploy/pod/odl-pod-with-redis.yaml
    statement: the password key in the fleet config is an environment reference; the secret lives in the Secret
  # The development profile collects Secrets (get/list, never watch or write)
  # to read certificate expiry facts; values are scrubbed at collection and
  # never stored (docs/ocp-api-manifest.md). The production profile disables
  # the kind, and deploy/rbac/odl-collector-readonly.fleet.yaml, generated
  # from it, asks for no Secrets access at all: bind that one on real clusters.
  - id: AVD-KSV-0041
    paths:
      - deploy/rbac/odl-collector-readonly.yaml
    statement: read-only Secrets access for certificate facts in the development profile only; the fleet role has none
