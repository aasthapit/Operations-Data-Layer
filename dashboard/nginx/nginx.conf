# Main nginx configuration for the dashboard image.
#
# Deliberately base-agnostic: the image is built on the official nginx alpine
# base by default and on a UBI nginx base behind a corporate registry, so
# nothing here relies on the official image's /docker-entrypoint.d envsubst
# machinery (a UBI base does not have it). Every path nginx writes to lives
# under /tmp, because the container runs with a read-only root filesystem, as
# an arbitrary UID in GID 0, with /tmp as the only writable mount.
#
# The server block is NOT here: it is rendered from default.conf.template by
# entrypoint.sh, because the port and the upstreams are runtime facts.

# No `user` directive. The container is started as a non-root UID already and
# a master process that is not root cannot switch user anyway - keeping the
# directive would only log a warning on every start.
worker_processes  auto;
pid               /tmp/nginx.pid;

error_log  /dev/stderr  warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Every scratch path nginx may write to, moved onto the writable tmpfs.
    # Without these a read-only root filesystem fails the first buffered
    # proxy response, not the start, which is the worst way to find out.
    client_body_temp_path  /tmp/nginx/client_body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Logs go to the pod's stdout / stderr, never to a file: the root
    # filesystem is read-only and log collection is the platform's job.
    access_log  /dev/stdout  main;

    sendfile             on;
    tcp_nopush           on;
    keepalive_timeout    65;
    types_hash_max_size  2048;

    # Do not advertise the nginx version on responses or error pages.
    server_tokens  off;

    # The bundle is a handful of large text files; compressing them is the
    # biggest single win on a first load over a corporate link. Images and
    # fonts are already compressed and are left alone.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/xml
                      image/svg+xml;

    include /tmp/nginx/conf.d/*.conf;
}
