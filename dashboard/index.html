<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operations Data Layer</title>
    <script>
      // Resolve the colour mode before the first paint, so a reload does not
      // flash the dark theme at someone who chose light (or the other way
      // round). React reads this attribute back in src/theme.ts when nothing is
      // stored, which is what keeps the two in step.
      (function () {
        try {
          var stored = localStorage.getItem("odl.color-mode");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", mode);
        } catch (e) {
          // Storage can be blocked. The markup's own data-theme stands.
        }
      })();
    </script>
    <style>
      /* The colour the page is painted before React mounts (phase 6, moved
         out of styles.css, which is now gone). MUI's CssBaseline paints this
         once the app renders, which is one frame too late to stop a reload
         flashing the wrong background; the script above has already set
         data-theme by the time this is parsed, so there is no bare :root
         case to cover. Values copied from theme.ts's DARK.bg/text and
         LIGHT.bg/text - if those ever move, move these with them. */
      html[data-theme="dark"] { background: #0f1419; color: #e6edf3; color-scheme: dark; }
      html[data-theme="light"] { background: #f4f6f9; color: #151b23; color-scheme: light; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
