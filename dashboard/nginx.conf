server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Patching system of record (separate service). Declared before /api/ for
    # readability; nginx picks the longest matching prefix either way.
    location /api/patching/ {
        proxy_pass http://patching:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # API + health proxied to the data layer (same origin -> no CORS).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /healthz {
        proxy_pass http://api:8000;
    }

    # SPA fallback: the router owns every path that is not an API call, so a
    # deep link (/clusters/ocp-east-2/workloads, /patching/<job id>) and a
    # reload both land on the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
