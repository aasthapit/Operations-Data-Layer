server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Patching system of record (separate service). Declared before /api/ for
    # readability; nginx picks the longest matching prefix either way.
    location /api/patching/ {
        proxy_pass http://patching:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # The agent's event stream. Declared before /api/ because everything nginx
    # does for a normal response - buffer it, cache it, give up after 120s - is
    # wrong for a server-sent event stream: the events would arrive in one
    # lump at the end of a run, which is the one thing generative UI must not
    # do. GET /api/agent (the capability check) is an ordinary request and is
    # served by the block below.
    location /api/agent/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding off;
    }

    # API + health proxied to the data layer (same origin -> no CORS).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
    location /healthz {
        proxy_pass http://api:8000;
    }

    # SPA fallback: the router owns every path that is not an API call, so a
    # deep link (/clusters/ocp-east-2/workloads, /patching/<job id>) and a
    # reload both land on the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
