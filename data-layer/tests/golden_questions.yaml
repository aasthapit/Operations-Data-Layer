# Golden questions for the natural-language query feature.
#
# Each entry is a question a platform engineer actually asks, the reference SQL
# a good answer would use, and what that SQL must return against the two-cluster
# fixture in tests/test_query_snapshot.py.
#
# They are used three ways:
#   * tests/test_query_snapshot.py asserts every reference SQL passes the guard
#     and returns what `expect` says - so the schema, the snapshot builder and
#     the fixture cannot drift apart silently;
#   * scripts/eval_ask.py sends each `question` to a live /api/query/ask and
#     compares the rows with the reference SQL - that is the prompt eval;
#   * they are the worked examples a new question can be modelled on.
#
# `expect` supports: row_count (exact), min_rows, columns (a subset that must be
# present) and contains (a mapping, or a list of mappings, each of which must
# match at least one row).

- id: unhealthy-clusters-by-region
  question: Which clusters are unhealthy right now, and which region is each in?
  sql: |
    SELECT name, region, environment, ocp_version, overall_status, health_score
    FROM clusters
    WHERE overall_status IN ('warning', 'critical')
    ORDER BY health_score, name
  expect:
    row_count: 2
    contains:
      - {name: ocp-west-1, region: eu-west-1, overall_status: critical}
      - {name: ocp-east-1, region: us-east-1, overall_status: warning}

- id: clusters-on-version
  question: Which clusters are still running OpenShift 4.15?
  sql: |
    SELECT name, region, environment, ocp_version, channel, overall_status
    FROM clusters
    WHERE ocp_version LIKE '4.15%'
    ORDER BY name
  expect:
    row_count: 1
    contains: {name: ocp-west-1, ocp_version: 4.15.30}

- id: image-blast-radius
  question: >-
    If nginx 1.19 has a CVE, which clusters, application namespaces and teams
    are affected?
  sql: |
    SELECT wi.cluster_name, c.region, c.environment, wi.namespace,
           ns.app_name, ns.team, wi.workload_kind, wi.workload_name, wi.image
    FROM workload_images AS wi
    JOIN clusters AS c ON c.name = wi.cluster_name
    LEFT JOIN namespaces AS ns
           ON ns.cluster_name = wi.cluster_name AND ns.name = wi.namespace
    WHERE wi.image ILIKE '%nginx:1.19%'
    ORDER BY wi.cluster_name, wi.namespace
  expect:
    row_count: 2
    contains:
      - {cluster_name: ocp-east-1, namespace: payments, team: payments}
      - {cluster_name: ocp-west-1, namespace: checkout, team: payments}

- id: certificates-expiring
  question: Which certificates expire in the next 30 days?
  sql: |
    SELECT cluster_name, namespace, name, key, status, expires_at,
           json_extract_string(summary, '$.certificates[0].subject') AS subject
    FROM resources
    WHERE key IN ('secrets', 'configmaps')
      AND expires_at IS NOT NULL
      AND expires_at <= now() + INTERVAL 30 DAY
    ORDER BY expires_at
  expect:
    row_count: 1
    contains: {cluster_name: ocp-east-1, name: api-tls, status: expiring}

- id: top-namespaces-by-cpu
  question: Which application namespaces are using the most CPU?
  sql: |
    SELECT cluster_name, name AS namespace, team, tier, cpu_usage, cpu_requests
    FROM namespaces
    WHERE ns_class = 'application' AND cpu_usage IS NOT NULL
    ORDER BY cpu_usage DESC
    LIMIT 10
  expect:
    row_count: 2
    contains: {namespace: payments, team: payments}

- id: operator-version-drift
  question: Which cluster operators are running different versions across the fleet?
  sql: |
    SELECT name AS operator,
           count(DISTINCT version) AS versions,
           string_agg(DISTINCT version, ', ' ORDER BY version) AS version_list,
           count(*) AS clusters
    FROM cluster_operators
    WHERE version IS NOT NULL
    GROUP BY name
    HAVING count(DISTINCT version) > 1
    ORDER BY versions DESC, operator
  expect:
    row_count: 2
    contains: {operator: ingress, versions: 2, clusters: 2}

- id: quotas-over-90-percent
  question: Which resource quotas are more than 90 percent used?
  sql: |
    SELECT cluster_name, namespace, name, status,
           CAST(json_extract(summary, '$.max_percent') AS DOUBLE) AS max_percent
    FROM resources
    WHERE key = 'resourcequotas'
      AND CAST(json_extract(summary, '$.max_percent') AS DOUBLE) >= 90
    ORDER BY max_percent DESC
  expect:
    row_count: 1
    contains: {cluster_name: ocp-east-1, namespace: payments, max_percent: 95.0}

- id: applications-per-team-on-prod
  question: How many applications does each team run in production?
  sql: |
    SELECT ns.team,
           count(DISTINCT ns.app_name) AS applications,
           count(*) AS namespaces,
           count(DISTINCT ns.cluster_name) AS clusters
    FROM namespaces AS ns
    JOIN clusters AS c ON c.name = ns.cluster_name
    WHERE ns.ns_class = 'application' AND c.environment = 'prod'
    GROUP BY ns.team
    ORDER BY applications DESC
  expect:
    row_count: 2
    contains:
      - {team: payments, applications: 2, clusters: 2}
      - {team: risk, applications: 1, clusters: 1}

- id: degraded-cluster-operators
  question: Which cluster operators are degraded, and what do they say?
  sql: |
    SELECT co.cluster_name, c.region, co.name, co.version, co.message
    FROM cluster_operators AS co
    JOIN clusters AS c ON c.name = co.cluster_name
    WHERE co.degraded
    ORDER BY co.cluster_name, co.name
  expect:
    row_count: 1
    contains: {cluster_name: ocp-west-1, name: ingress}

- id: olm-operator-versions
  question: Which OLM operator packages are installed, and at which versions?
  sql: |
    SELECT json_extract_string(summary, '$.package') AS package,
           json_extract_string(summary, '$.version') AS version,
           count(DISTINCT cluster_name) AS clusters
    FROM resources
    WHERE key = 'clusterserviceversions'
    GROUP BY package, version
    ORDER BY package, version
  expect:
    row_count: 2
    contains:
      - {package: elasticsearch-operator, version: 5.8.1, clusters: 1}
      - {package: elasticsearch-operator, version: 5.8.13, clusters: 1}

- id: pod-issues-by-reason
  question: What is going wrong with pods across the fleet, by reason?
  sql: |
    SELECT reason, ns_class, count(*) AS pods,
           count(DISTINCT cluster_name) AS clusters
    FROM pod_issues
    GROUP BY reason, ns_class
    ORDER BY pods DESC, reason
  expect:
    min_rows: 1
    contains: {reason: CrashLoopBackOff, ns_class: application}

- id: cluster-health-history
  question: Show the health score of every cluster over time.
  sql: |
    SELECT cluster_name, snapshot_at, health_score, overall_status, pod_issues
    FROM health_snapshots
    ORDER BY snapshot_at DESC, cluster_name
  expect:
    row_count: 2
    columns: [cluster_name, snapshot_at, health_score]
