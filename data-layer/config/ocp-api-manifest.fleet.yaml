# Operations Data Layer - OCP API manifest, FLEET PROFILE
# =======================================================
#
# The production profile: the same manifest as ocp-api-manifest.yaml, with a
# collection SCHEDULE. Point a collector at it with
#
#     ODL_MANIFEST=config/ocp-api-manifest.fleet.yaml
#
# Why: an estate of seven ACM hubs with ~114 clusters each cannot be read
# whole every two minutes (ADR-0003, Finding 1: ~120 MB of Kubernetes JSON per
# cluster per full pass). Nothing here reads less of a cluster - it reads each
# kind on the cadence that kind actually changes on:
#
#   every sweep (REFRESH_INTERVAL_SECONDS)  platform state: ClusterVersion,
#       cluster operators, infrastructure / network / ingress config, nodes and
#       node metrics, MachineConfigPools, namespaces, pods, pod metrics, events.
#       This is what the health panel grades and what changes minute to minute.
#   every 15m   inventory: workloads, autoscalers, services, routes, ingresses,
#       network policies, storage, quotas, OLM, cluster-admin bindings. Between
#       collections the stored rows stand, and every API answer says how old
#       they are (GET /api/manifest/availability, `cached` + `collected_at`).
#   disabled    Secrets and ConfigMaps. They are the heaviest kinds by far
#       (roughly half the bytes of a full pass) and only the certificate facts
#       inside them are used, so they are off here and the `certificates-valid`
#       health check is off with them.
#
# To get certificate expiry back without paying for it every sweep, read those
# two kinds hourly and re-enable the check:
#
#     resources:
#       secrets:    { enabled: true, interval: 1h }
#       configmaps: { enabled: true, interval: 1h }
#     health_checks:
#       certificates-valid: { enabled: true }
#
# `POST /api/refresh?full=true` ignores every tier and collects everything once
# (what to run after changing this file). Everything else - namespace
# classification, ownership, what is scrubbed, the health checks - is identical
# to the default manifest; see docs/ocp-api-manifest.md.

namespaces:
  # OpenShift / Kubernetes platform namespaces are grouped separately.
  # Every other namespace is treated as an application.
  platform:
    names:
      - default
      - kube-system
      - kube-public
      - kube-node-lease
      - openshift
      - local-path-storage        # kind's default storage provisioner
    prefixes:
      - openshift-
      - kube-
      - open-cluster-management
      - multicluster-engine
      - hive
      - rhacs-operator
      - stackrox
    # A namespace carrying any of these label keys is platform, whatever its name.
    label_keys:
      - openshift.io/run-level

  # Where application identity comes from. For each field the first label
  # present on the namespace wins (in order); if none is present the most
  # common value across the namespace's workloads is used; `app` finally falls
  # back to the namespace name.
  # Only these labels may name an application or its line of business when
  # the registry (app-map.json) does not know a namespace. Generic labels such
  # as app.kubernetes.io/part-of are deliberately NOT here: on a real estate
  # they carry platform-wide values and mis-group whole fleets under one name.
  ownership:
    app:  [app_id]
    team: [lob]
    tier: []

# Where application ownership comes from.
#   labels   (default) identity, team and tier from the `ownership` label keys
#            above, app falling back to the namespace name
#   mapping  a registry file maps (cluster, namespace) -> application, line of
#            business, environment. Labels are ignored, every resource in a
#            namespace belongs to that namespace's application, and a namespace
#            absent from the file is "not under a business application"
#            (app_name null, assigned false). JSON or YAML list of records;
#            `fields` names the record keys. Re-read when the file changes.
#            ODL_APP_MAP overrides the path.
applications:
  # The registry (app-map.json) is the source of ownership. A namespace the
  # registry does not list may still be claimed by its own `app_id` / `lob`
  # labels (fallback: labels); anything else is "not under a business
  # application". Set fallback: none to trust the registry alone.
  source: mapping
  mapping:
    path: app-map.json          # relative to this manifest's directory (ODL_APP_MAP overrides)
    fallback: labels            # none | labels (only the ownership keys above)
    fields:
      cluster: cluster
      namespace: namespace
      app: app_id
      team: lob
      environment: environment  # the namespace's environment (development, test, ...)
      cluster_environment: env  # fills the cluster's environment when ACM has none
  # OpenShift's own namespaces grouped as applications of their own, so the
  # platform shows up in the applications and blast-radius views with a tier.
  # Entries are exact namespace names or prefixes ending in `*`; first match wins.
  platform_apps:
    - name: openshift-critical
      team: platform
      tier: critical
      namespaces:
        - openshift-etcd
        - openshift-kube-apiserver
        - openshift-kube-controller-manager
        - openshift-kube-scheduler
        - openshift-apiserver
        - openshift-oauth-apiserver
        - openshift-authentication
        - openshift-ingress
        - openshift-ingress-operator
        - openshift-dns
        - openshift-ovn-kubernetes
        - openshift-sdn
        - openshift-network-operator
        - openshift-machine-api
        - openshift-machine-config-operator
        - openshift-cluster-version
        - openshift-operator-lifecycle-manager
        - openshift-monitoring
        - openshift-image-registry
        - openshift-console
    - name: openshift-platform
      team: platform
      tier: standard
      namespaces: ["openshift-*", "kube-*", open-cluster-management*, multicluster-engine]

# Annotations are dropped unless listed here. (kubectl's
# last-applied-configuration annotation can embed an entire object, including
# Secret data, so annotations default to closed.)
keep_annotations:
  - openshift.io/requester
  - openshift.io/display-name
  - openshift.io/description
  - deployment.kubernetes.io/revision
  - service.beta.openshift.io/serving-cert-secret-name
  - cert-manager.io/certificate-name
  - storageclass.kubernetes.io/is-default-class

# Two kinds of number, and the difference matters.
#
#   COLLECTION time  applied by the parsers while a cluster is read, so they
#                    decide what the stored document SAYS. Changing one only
#                    takes effect on the next sweep.
#   EVALUATION time  applied by the health checks to an already-collected
#                    document (the `health_checks:` block below). Changing one
#                    re-grades the fleet on the next sweep without collecting
#                    anything different.
#
# `thresholds:` is the older flat block. It is still supported, and the four
# keys that always fed a health check are now the DEFAULTS of that check's
# level (see the mapping in each comment). Set the level under `health_checks:`
# to override it per check.
thresholds:
  # COLLECTION: certs expiring within this window are stored as status
  # "expiring". Also the default of certificates-valid.warn.expiring_within_days.
  certificate_expiry_days: 30
  # COLLECTION: restarts at/above this make a pod an issue.
  pod_restart_threshold: 5
  # COLLECTION: Pending (or not-ready) longer than this is an issue.
  pod_pending_seconds: 300
  # COLLECTION: ResourceQuota usage at/above this is stored as status "warning".
  # Also the default of quotas-headroom.warn.max_percent.
  quota_warning_percent: 90
  # EVALUATION: default of capacity-headroom.warn.used_percent / .fail.used_percent.
  capacity_warning_percent: 85
  capacity_critical_percent: 95
  # COLLECTION: which ClusterRoleBindings are reported.
  cluster_admin_roles: [cluster-admin]

# Health checks
# =============
#
# Every check in the panel is configurable here. Each entry takes:
#
#   enabled:  true | false      a disabled check is not run and not shown
#   severity: critical | warning | info
#                               what a FAILING check means for the cluster:
#                               critical -> the cluster is critical,
#                               warning  -> the cluster is a warning,
#                               info     -> surfaced, never degrades the rollup
#   warn: / fail:               levels in the check's own unit
#
# A measured value at or above `fail` is a fail, at or above `warn` is a warn,
# otherwise the check passes. `version-supported`'s `floor` is the one level
# that compares the other way (a version BELOW it trips the band), and
# `expiring_within_days` is a window rather than a level: it says how far ahead
# that band looks. A band you set REPLACES that band's defaults rather than
# merging into it, so write every level you want in it: `fail: { degraded: 3 }`
# on its own means "never warn, fail at three", and `warn: {}` means "never
# warn". A `warn` result always rolls the cluster up to at most `warning`,
# whatever the severity; anything at `info` never degrades it.
#
# Everything below is commented out at its default, so this block documents the
# units without changing behaviour. Uncomment a line to change a check, e.g.
# "one degraded operator is a warning, three are critical":
#
#   no-degraded-operators:
#     warn: { degraded: 1 }
#     fail: { degraded: 3 }
#
# The effective configuration is served by GET /api/manifest, and every check
# result carries the value it measured and the levels that applied.
health_checks:

  # Could the collector connect to the cluster at all? When it could not, this
  # is the ONLY check that runs, so it cannot be disabled; its severity can be
  # lowered if an unreachable cluster should not count as critical.
  cluster-reachable:
    severity: critical

  # The hub's ManagedClusterConditionAvailable for this cluster.
  managed-available:
    enabled: true
    severity: critical

  # ClusterVersion is Available and not Failing.
  cluster-version-available:
    enabled: true
    severity: critical

  # Cluster operators the registry marks critical (etcd, kube-apiserver, ...)
  # reporting Available=False.
  #   unavailable (count)
  critical-operators-available:
    enabled: true
    severity: critical
    fail: { unavailable: 1 }

  # Cluster operators reporting Degraded=True.
  #   degraded (count)
  no-degraded-operators:
    enabled: true
    severity: critical
    fail: { degraded: 1 }

  # Nodes whose Ready condition is not True. A cluster that reported no nodes at
  # all warns as informational - that is missing data, not a sick cluster.
  #   not_ready          (count)
  #   not_ready_percent  (percent of the cluster's nodes)
  nodes-ready:
    enabled: true
    severity: critical
    fail: { not_ready: 1 }

  # Nodes reporting a pressure condition (memory / disk / PID), and nodes that
  # are cordoned. By default pressure fails and a cordon warns.
  #   pressured  (count)
  #   cordoned   (count)
  nodes-pressure:
    enabled: true
    severity: warning
    warn: { cordoned: 1 }
    fail: { pressured: 1 }

  # The cluster's OCP version against the supported floor. A version BELOW the
  # floor trips the band. The default floor is the SUPPORTED_FLOOR setting.
  #   floor (version)
  version-supported:
    enabled: true
    severity: warning
    fail: { floor: "4.15.0" }

  # Is ClusterVersion applying a new release? Informational by default: an
  # upgrade is expected work, not ill health.
  upgrade-in-progress:
    enabled: true
    severity: info

  # Cluster operators reporting Progressing=True while the cluster is NOT
  # upgrading (an operator mid-rollout). Measures zero during an upgrade.
  #   progressing (count)
  operators-stable:
    enabled: true
    severity: warning
    warn: { progressing: 1 }

  # MachineConfigPools degraded or still rolling out a machine config. An
  # updating pool is reported as informational - it is a transition, not a fault.
  #   degraded (count)
  #   updating (count)
  machine-config-pools:
    enabled: true
    severity: critical
    warn: { updating: 1 }
    fail: { degraded: 1 }

  # Problem pods (crash-looping, OOM-killed, unschedulable, long-pending,
  # high-restart) in platform namespaces. What counts as a problem pod is
  # decided at COLLECTION time by thresholds.pod_restart_threshold and
  # thresholds.pod_pending_seconds.
  #   issues          (count)
  #   issues_percent  (percent of the platform namespaces' pods)
  platform-pods:
    enabled: true
    severity: warning
    warn: { issues: 1 }

  # The same, in application namespaces. Informational by default: one
  # application's broken pod is not the cluster's problem.
  #   issues          (count)
  #   issues_percent  (percent of the application namespaces' pods)
  application-pods:
    enabled: true
    severity: info
    warn: { issues: 1 }

  # Live usage against allocatable, whichever of CPU and memory is worse.
  # Reported as informational on a cluster that does not serve metrics.k8s.io.
  #   used_percent (percent of allocatable)
  capacity-headroom:
    enabled: true
    severity: warning
    warn: { used_percent: 85 }    # thresholds.capacity_warning_percent
    fail: { used_percent: 95 }    # thresholds.capacity_critical_percent

  # Certificates found in Secrets and ConfigMaps. `expiring_within_days` is the
  # band's window: each band counts the certificates expiring inside its own
  # window and compares that count with its `expiring` level. Adding
  # `fail: { expiring: 1, expiring_within_days: 7 }` means "a certificate with a
  # week left is a failure".
  #   expired               (count)
  #   expiring              (count, inside the band's window)
  #   expiring_within_days  (days - the band's window, not a level)
  # OFF in this profile: it grades certificate facts that come from Secrets and
  # ConfigMaps, and those are not collected here. Turn both back on together
  # (see the header) - a check without its data would report "healthy" on an
  # empty panel.
  certificates-valid:
    enabled: false
    severity: warning
    warn: { expiring: 1, expiring_within_days: 30 }   # thresholds.certificate_expiry_days
    fail: { expired: 1 }

  # The most-consumed ResourceQuota in the cluster, against its hard limit.
  #   max_percent  (percent of a hard limit)
  #   namespaces   (count of quotas at or above the warn percent)
  quotas-headroom:
    enabled: true
    severity: info
    warn: { max_percent: 90 }     # thresholds.quota_warning_percent

  # ClusterServiceVersions not in the Succeeded phase. Skipped entirely on a
  # cluster without OLM.
  #   unhealthy (count)
  olm-operators-healthy:
    enabled: true
    severity: warning
    warn: { unhealthy: 1 }

  # Does ClusterVersion offer a newer release? Only reported when there is one
  # and the cluster is not already upgrading.
  update-available:
    enabled: true
    severity: info

# Resources
# =========
#
# `interval:` is this file's point: 0 = every sweep, otherwise the kind is
# fetched only when `now - collected_at >= interval` and the previous rows are
# kept until then. A kind that is disabled contributes nothing at all.
resources:
  # ---- platform state: every sweep ----------------------------------------
  clusterversion:        { enabled: true, interval: 0 }
  clusteroperators:      { enabled: true, interval: 0 }
  infrastructure:        { enabled: true, interval: 0 }
  network_config:        { enabled: true, interval: 0 }
  ingress_config:        { enabled: true, interval: 0 }
  nodes:                 { enabled: true, interval: 0 }
  node_metrics:          { enabled: true, interval: 0 }   # metrics.k8s.io - live CPU/memory per node
  machineconfigpools:    { enabled: true, interval: 0 }
  namespaces:            { enabled: true, interval: 0 }
  pods:                  { enabled: true, interval: 0 }   # the health panel's pod issues
  pod_metrics:           { enabled: true, interval: 0 }   # metrics.k8s.io - live CPU/memory per pod
  events:                { enabled: true, interval: 0, limit: 200 }   # what is going wrong right now

  # ---- inventory: every 15 minutes ----------------------------------------
  # Rows the fleet views and blast radius are built from. They change when
  # somebody deploys, not continuously, and the age of each is visible.
  deployments:              { enabled: true, interval: 15m }
  statefulsets:             { enabled: true, interval: 15m }
  daemonsets:               { enabled: true, interval: 15m }
  cronjobs:                 { enabled: true, interval: 15m }
  horizontalpodautoscalers: { enabled: true, interval: 15m }
  services:                 { enabled: true, interval: 15m }
  routes:                   { enabled: true, interval: 15m }
  ingresses:                { enabled: true, interval: 15m }
  networkpolicies:          { enabled: true, interval: 15m }
  persistentvolumeclaims:   { enabled: true, interval: 15m }
  persistentvolumes:        { enabled: true, interval: 15m }
  storageclasses:           { enabled: true, interval: 15m }
  resourcequotas:           { enabled: true, interval: 15m }
  clusterserviceversions:   { enabled: true, interval: 15m }   # OLM-installed operators
  subscriptions:            { enabled: true, interval: 15m }
  clusterrolebindings:      { enabled: true, interval: 15m }   # only bindings to thresholds.cluster_admin_roles

  # ---- off: the heaviest kinds, for certificate facts only ----------------
  # See the header for reading these hourly instead of not at all.
  secrets:               { enabled: false, interval: 1h }
  configmaps:            { enabled: false, interval: 1h }
