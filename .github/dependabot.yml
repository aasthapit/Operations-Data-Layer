# Dependency updates for every ecosystem in the repo, weekly, so the SCA scan
# has something to say "fixed" about. Actions are included: an unpinned or
# stale action is the supply chain of the pipeline itself.
version: 2
updates:
  - package-ecosystem: pip
    directory: /data-layer
    schedule: { interval: weekly }
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /mcp-server
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /patching-service
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /dashboard
    schedule: { interval: weekly }
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/data-layer, /dashboard, /mcp-server, /patching-service]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
