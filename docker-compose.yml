# Operations Data Layer - local stack.
#
# The `api` service joins the external `kind` network so the collector can reach
# the hub and managed cluster API servers by their in-network hostnames
# (https://<cluster>-control-plane:6443), exactly as referenced by the internal
# kubeconfigs the fleet exported.
#
# Everything the data layer knows comes from the clusters' own API servers
# (inventory, configuration, and utilization via metrics.k8s.io). There is no
# Prometheus / Thanos dependency. The collected state lives in Redis, a pull
# cache the collector replaces one cluster at a time (docs/redis-keyspace.md).
#
# Host ports are parametrised so a second stack (a worktree, a review build) can
# run beside this one: ODL_API_PORT=18001 docker compose up -d redis api
#
# Every published port binds to loopback (ODL_BIND). None of these services
# authenticates anything - the API answers the whole fleet's inventory to any
# caller - so the default must not put them on the laptop's other interfaces
# and, through them, on whatever network it is attached to. A stack that really
# has to be reachable from another machine opts in, and takes the consequences:
#   ODL_BIND=0.0.0.0 docker compose up -d

networks:
  kind:
    external: true        # created by kind; `make fleet-up` must run first
  odl:
    driver: bridge

volumes:
  redisdata:
  pgdata:
  n8ndata:

services:
  redis:
    image: redis:7-alpine
    # noeviction: a cache that silently dropped a cluster would answer
    # blast-radius questions wrongly. Per-cluster keys carry their own TTL
    # (REDIS_TTL_SECONDS) instead. Snapshotting is enough durability for a
    # cache that any sweep can rebuild, so the AOF stays off.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no",
              "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks: [odl]
    ports:
      - "${ODL_BIND:-127.0.0.1}:${ODL_REDIS_PORT:-16379}:6379"   # for the ad-hoc host processes (Procfile)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Postgres is only the patching system of record below; the data layer itself
  # no longer uses it and porting the patching service is out of scope here.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: odl
      POSTGRES_PASSWORD: odl
      POSTGRES_DB: odl
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [odl]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odl"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./data-layer
    environment:
      # API and collector in one process - the simple two-container shape.
      # The pod manifests split them into ODL_ROLE=api and ODL_ROLE=worker
      # so collection can be scaled on its own (deploy/pod, docs/containers.md).
      ODL_ROLE: all
      REDIS_URL: redis://redis:6379/0
      HUBS_CONFIG: /app/config/hubs.yaml
      # What is collected from every cluster (see docs/ocp-api-manifest.md).
      ODL_MANIFEST: /app/config/ocp-api-manifest.yaml
      REFRESH_INTERVAL_SECONDS: "120"
      REFRESH_ON_STARTUP: "true"
      COLLECT_WORKERS: "4"
      SUPPORTED_FLOOR: "4.15.0"
      # Which model answers /api/query/ask and /api/agent/run: anthropic (the
      # default, with a key from the host's environment or .env) or ollama, a
      # model on the host. Inside the container the daemon is not on localhost,
      # so the Ollama URL goes through host.docker.internal - which Docker
      # Desktop resolves for free and Linux needs an extra_hosts entry for.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ODL_LLM_PROVIDER: ${ODL_LLM_PROVIDER:-anthropic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ODL_OLLAMA_MODEL: ${ODL_OLLAMA_MODEL:-gpt-oss:20b}
      ODL_OLLAMA_NUM_CTX: ${ODL_OLLAMA_NUM_CTX:-32768}
      ODL_OLLAMA_TIMEOUT_SECONDS: ${ODL_OLLAMA_TIMEOUT_SECONDS:-300}
      ODL_OLLAMA_THINK: ${ODL_OLLAMA_THINK:-auto}
    volumes:
      - ./fleet:/fleet:ro                       # kubeconfigs referenced by hubs.yaml
      - ./data-layer/config:/app/config:ro      # generated hub list + the OCP API manifest
    networks: [odl, kind]
    ports:
      - "${ODL_BIND:-127.0.0.1}:${ODL_API_PORT:-18000}:8000"   # host 8000/8001 often taken; internally api:8000
    depends_on:
      redis:
        condition: service_healthy

  # Patching system of record (its own `patching` database in the same Postgres).
  patching:
    build: ./patching-service
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: odl
      PG_PASSWORD: odl
      PG_DB: patching
    networks: [odl]
    ports:
      - "${ODL_BIND:-127.0.0.1}:${ODL_PATCHING_PORT:-18010}:8000"     # http://localhost:18010/docs
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    environment:
      # nginx renders its server block from these at start (dashboard/nginx).
      # Here the two upstreams are separate services; in the pod they are both
      # localhost, which is why they are runtime settings and not baked in.
      API_UPSTREAM: api:8000
      PATCHING_UPSTREAM: patching:8000
    networks: [odl]
    ports:
      - "${ODL_BIND:-127.0.0.1}:${ODL_DASHBOARD_PORT:-8080}:8080"   # the image is unprivileged: 8080, not 80
    depends_on:
      - api
      - patching

  # MCP server wrapping the API (streamable-http transport). Optional - start
  # with `docker compose up -d mcp`. For local Claude Code, the stdio variant in
  # mcp-server/README.md is usually simpler.
  mcp:
    build: ./mcp-server
    environment:
      MCP_API_BASE: http://api:8000
      MCP_TRANSPORT: streamable-http
    networks: [odl]
    ports:
      - "${ODL_BIND:-127.0.0.1}:${ODL_MCP_PORT:-18080}:8000"   # MCP endpoint at http://localhost:18080/mcp
    depends_on:
      - api

  # ---- Patching orchestration (N8N) ---------------------------------------
  # Reaches the data layer at http://api:8000 inside the compose network.
  # Import patching/n8n-patching-workflow.json once it's up.
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.70.0
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8ndata:/home/node/.n8n
      - ./patching:/workflows:ro
    networks: [odl]
    ports:
      - "${ODL_BIND:-127.0.0.1}:${ODL_N8N_PORT:-5678}:5678"
    depends_on:
      - api
