# Prometheus scrapes the metrics-generator (the local stand-in for per-cluster
# Prometheus remote-write). Thanos sidecar puts a StoreAPI on top; Thanos Query
# is the PromQL surface the data layer and Grafana use.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: odl-local

scrape_configs:
  - job_name: fleet-usage
    static_configs:
      - targets: ["metrics-generator:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
