# Redis, if nobody operates one for you.
#
# Deliberately NOT in kustomization.yaml: a single-replica Redis on a PVC is
# a development convenience, not a thing to run a fleet's state on. Prefer a
# managed instance and point REDIS_URL at it. If you do want this one:
#
#   oc apply -f deploy/openshift/redis.yaml
#   oc create secret generic odl-secrets ... --from-literal=REDIS_URL=redis://odl-redis:6379/0
#
# One replica with a PVC: the data is a cache any collection sweep can
# rebuild, but rebuilding it costs a full fleet sweep, so it is worth
# persisting across a pod restart. `noeviction` is deliberate - silently
# dropping a cluster would make blast-radius answers wrong. Per-cluster keys
# carry their own TTL (REDIS_TTL_SECONDS) so stale clusters age out instead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: odl-redis
  labels: { app: odl, component: redis }
data:
  redis.conf: |
    save 60 1
    appendonly no
    maxmemory-policy noeviction
    # Every path redis may write to, under the PVC: the root filesystem is
    # read-only.
    dir /data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odl-redis
  labels: { app: odl, component: redis }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odl-redis
  labels: { app: odl, component: redis }
spec:
  replicas: 1
  strategy:
    type: Recreate           # one writer, one RWO volume
  selector:
    matchLabels: { app: odl, component: redis }
  template:
    metadata:
      labels: { app: odl, component: redis }
    spec:
      securityContext:
        # Pod-level, so a container added later inherits the policy.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # No runAsUser and no fsGroup: restricted-v2 assigns both from the
      # namespace's ranges, and the PVC is chowned to the assigned fsGroup so
      # the arbitrary UID can write to it. Pinning either one here would be
      # rejected by the SCC for being outside the range.
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["/etc/redis/redis.conf"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
              readOnly: true
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: odl-redis }
        - name: config
          configMap: { name: odl-redis }
---
apiVersion: v1
kind: Service
metadata:
  name: odl-redis
  labels: { app: odl, component: redis }
spec:
  selector: { app: odl, component: redis }
  ports:
    - port: 6379
      targetPort: 6379
