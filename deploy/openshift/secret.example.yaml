# The credentials the pod runs with. NOT part of kustomization.yaml, and not
# a file to fill in and commit - it is here to document the key names.
#
# Create it from the command line instead, so the values never reach git:
#
#   oc create secret generic odl-secrets \
#       --from-literal=OCP_USERNAME=svc-ops-data \
#       --from-literal=OCP_PASSWORD='...' \
#       --from-literal=REDIS_URL='rediss://odl:...@redis.example.internal:6380/0' \
#       --from-literal=ANTHROPIC_API_KEY=''
#
# Or let a secret manager own them. With the External Secrets Operator the
# same keys come from a vault and are rotated without a redeploy:
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: odl-secrets
#   spec:
#     secretStoreRef: { name: vault, kind: ClusterSecretStore }
#     target: { name: odl-secrets }
#     refreshInterval: 1h
#     data:
#       - secretKey: OCP_PASSWORD
#         remoteRef: { key: ops-data-layer, property: ocp_password }
#       - secretKey: REDIS_URL
#         remoteRef: { key: ops-data-layer, property: redis_url }
#
# The pod reads the whole Secret with envFrom, so any extra key becomes an
# environment variable - which is how a per-hub ${ACM_WEST_TOKEN} in the
# fleet config gets its value.
apiVersion: v1
kind: Secret
metadata:
  name: odl-secrets
  labels:
    app: odl
type: Opaque
stringData:
  # The shared read-only service account the collector logs in to every hub
  # and cluster with (deploy/rbac/odl-collector-readonly.yaml grants it).
  OCP_USERNAME: svc-ops-data
  OCP_PASSWORD: change-me
  # The instance must run maxmemory-policy noeviction (ADR-0001).
  REDIS_URL: rediss://odl:change-me@redis.example.internal:6380/0
  # Only POST /api/query/ask and POST /api/agent/run need this. Everything
  # else, including POST /api/query/sql, works with it empty.
  ANTHROPIC_API_KEY: ""
