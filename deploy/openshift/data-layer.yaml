apiVersion: v1
kind: ServiceAccount
metadata:
  name: odl-collector
  labels: { app: odl }
---
# Per-hub access. In a real ACM deployment, replace these kubeconfigs with
# cluster-proxy / ManagedServiceAccount tokens. On each managed cluster the data
# layer needs only the read access generated from the OCP API manifest
# (deploy/rbac/odl-collector-readonly.yaml); on the hub it needs to list
# ManagedClusters and read the per-cluster kubeconfig secrets.
apiVersion: v1
kind: Secret
metadata:
  name: odl-hub-kubeconfigs
  labels: { app: odl }
stringData:
  # hub-a.kubeconfig: |
  #   apiVersion: v1
  #   kind: Config
  #   ...
  hubs.yaml: |
    hubs: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odl-api
  labels: { app: odl, component: api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: odl, component: api }
  template:
    metadata:
      labels: { app: odl, component: api }
    spec:
      serviceAccountName: odl-collector
      containers:
        - name: api
          image: image-registry.openshift-image-registry.svc:5000/ops-data-layer/odl-api:latest
          env:
            - name: REDIS_URL
              value: redis://odl-redis:6379/0
            # Per-cluster keys age out if a cluster stops being collected.
            - name: REDIS_TTL_SECONDS
              value: "86400"
            - name: HUBS_CONFIG
              value: /etc/odl/hubs.yaml
            # The OCP API manifest ships in the image; mount a ConfigMap over
            # this path to customise what is collected without a rebuild.
            - name: ODL_MANIFEST
              value: /app/config/ocp-api-manifest.yaml
            - name: REFRESH_INTERVAL_SECONDS
              value: "300"
            - name: SUPPORTED_FLOOR
              value: "4.15.0"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: hub-kubeconfigs
              mountPath: /etc/odl
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
      volumes:
        - name: hub-kubeconfigs
          secret: { secretName: odl-hub-kubeconfigs }
---
apiVersion: v1
kind: Service
metadata:
  name: odl-api
  labels: { app: odl, component: api }
spec:
  selector: { app: odl, component: api }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: odl-api
  labels: { app: odl, component: api }
spec:
  to:
    kind: Service
    name: odl-api
  port:
    targetPort: 8000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
