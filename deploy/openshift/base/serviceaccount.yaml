# The identity the pod runs as inside the cluster it is deployed on.
#
# It needs no in-cluster permissions: the data layer reads OTHER clusters,
# through their API servers, with the credentials in odl-secrets. What it
# needs on those clusters is deploy/rbac/odl-collector-readonly.yaml.
#
# It exists so that the restricted-v2 SCC, NetworkPolicies and audit trails
# have something specific to name, rather than the namespace's `default`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: odl
  labels:
    app: odl
