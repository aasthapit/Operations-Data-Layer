apiVersion: v1
kind: Secret
metadata:
  name: odl-db
  labels: { app: odl }
stringData:
  POSTGRES_USER: odl
  POSTGRES_PASSWORD: odl
  POSTGRES_DB: odl
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odl-db
  labels: { app: odl }
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odl-db
  labels: { app: odl, component: db }
spec:
  replicas: 1
  selector:
    matchLabels: { app: odl, component: db }
  template:
    metadata:
      labels: { app: odl, component: db }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: odl-db }
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "odl"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: odl-db }
---
apiVersion: v1
kind: Service
metadata:
  name: odl-db
  labels: { app: odl, component: db }
spec:
  selector: { app: odl, component: db }
  ports:
    - port: 5432
      targetPort: 5432
