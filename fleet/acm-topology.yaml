# ACM test topology - real OCM + Tekton on kind, separate from the simulated fleet.
#
# The simulated fleet (topology.yaml) carries CRDs only and is read by the data
# layer. This topology carries real controllers: Open Cluster Management (the
# upstream of RHACM) on the hubs and Tekton Pipelines on the spokes, so that
# ACM-delivered pipeline execution can be tested end to end.
#
# Everything is pinned so `make acm-down && make acm-up` is deterministic.
# Bump procedure is documented in docs/acm-test-topology.md.

versions:
  # kind node image for all 6 clusters (digest from the kind v0.31.0 release notes)
  kind_node_image: "kindest/node:v1.33.7@sha256:d26ef333bdb2cbe9862a0f7c3803ecc7b4303d8cea8e814b481b09949d353040"
  # clusteradm CLI release expected on the host (warn-only check)
  clusteradm: "v1.3.1"
  # OCM operator bundle passed to `clusteradm init/join --bundle-version`
  ocm_bundle: "1.3.1"
  # Tekton Pipelines release applied to every spoke (pinned LTS stream)
  tekton_release: "https://github.com/tektoncd/pipeline/releases/download/v1.14.1/release.yaml"
  # step image used by the ManifestWork -> PipelineRun smoke test
  smoke_image: "busybox:1.36"

hubs:
  - name: acm-hub-1
    spokes: [acm-spoke-1a, acm-spoke-1b]
  - name: acm-hub-2
    spokes: [acm-spoke-2a, acm-spoke-2b]
